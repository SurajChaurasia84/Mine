name: mine
description: "Private Messenger"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1
  mqtt_client: ^10.11.11
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
 